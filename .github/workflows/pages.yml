name: Deploy site

# Publishes the public site to GitHub Pages on every push to main.
# Enable once in the repo: Settings → Pages → Source → "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Only these files go public. Everything else in the repo — the playbook
      # source, the .docx, the README, the verification checklist — stays private.
      - name: Assemble site
        run: |
          # ─── FRONT_DOOR decides which page is served at / ───────────────
          #   early  the early-access page. The full landing page is NOT published.
          #   full   the full landing page, with pricing and the booking flow.
          #
          # Switch to "full" on launch day, once the two Google Forms, Cal.com
          # and Stripe are live and the legal pages have been filled in.
          FRONT_DOOR=early

          mkdir -p _site/d
          cp teaser.html privacy.html terms.html 404.html og-image.png _site/
          cp robots.txt sitemap.xml _site/
          cp savvyaviator-teaser.pdf _site/
          # Delivered via the signup form's confirmation link, not linked from the site.
          cp savvyaviator-playbook.pdf _site/d/

          if [ "$FRONT_DOOR" = "early" ]; then
            cp early.html _site/index.html
          elif [ "$FRONT_DOOR" = "full" ]; then
            cp index.html _site/index.html
          else
            echo "FRONT_DOOR must be 'early' or 'full', got '$FRONT_DOOR'" >&2
            exit 1
          fi

          touch _site/.nojekyll
          echo "Front door: $FRONT_DOOR"
          echo "Assembled:" && find _site -type f | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
